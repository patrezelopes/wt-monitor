<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wt-monitor</title>
<style>
  :root { --bg:#09090b; --surface:#111114; --elev:#1a1a1f; --border:#222228; --border2:#2f2f37; --text:#f4f4f5; --muted:#a1a1aa; --faint:#8b8b95;
    --accent:#3ecf8e; --accent-ink:#04130b; --work:#3ecf8e; --wait:#f5a623; --hot:#f2555a; --idle:#8b8b95; --shadow:none; --scrim:rgba(0,0,0,.55); color-scheme:dark }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#fafafa; --surface:#fff; --elev:#f1f1f3; --border:#e4e4e7; --border2:#d4d4d8; --text:#18181b; --muted:#52525b; --faint:#71717a;
    --accent:#0a7d4f; --accent-ink:#fff; --work:#0a7d4f; --wait:#b45309; --hot:#c62828; --idle:#71717a; --shadow:0 1px 2px rgba(24,24,27,.05); --scrim:rgba(24,24,27,.35); color-scheme:light } }
  :root[data-theme="light"] { --bg:#fafafa; --surface:#fff; --elev:#f1f1f3; --border:#e4e4e7; --border2:#d4d4d8; --text:#18181b; --muted:#52525b; --faint:#71717a;
    --accent:#0a7d4f; --accent-ink:#fff; --work:#0a7d4f; --wait:#b45309; --hot:#c62828; --idle:#71717a; --shadow:0 1px 2px rgba(24,24,27,.05); --scrim:rgba(24,24,27,.35); color-scheme:light }

  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:-.006em; font-variant-numeric:tabular-nums }
  button { font:inherit; color:inherit }
  .mono { font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace }
  .faint { color:var(--faint) } .muted { color:var(--muted) }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow) }
  [hidden] { display:none !important }

  /* barra superior */
  .nav { height:56px; display:flex; align-items:center; gap:24px; padding:0 32px; border-bottom:1px solid var(--border) }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px }
  .root { color:var(--faint); font-size:12px }
  .search { flex:1; display:flex; justify-content:center }
  .search label { width:100%; max-width:440px; height:34px; display:flex; align-items:center; gap:8px; padding:0 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--faint) }
  .search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:13px }
  kbd { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px; padding:1px 6px; border:1px solid var(--border2); border-radius:5px; color:var(--muted) }
  .seg { display:inline-flex; padding:2px; border:1px solid var(--border); border-radius:8px; background:var(--surface) }
  .seg button { all:unset; cursor:pointer; padding:4px 12px; border-radius:6px; font-size:13px; color:var(--muted) }
  .seg button[aria-pressed="true"] { background:var(--elev); color:var(--text); font-weight:500 }
  .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:1px }
  .live { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); white-space:nowrap }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none }
  .live .dot { width:7px; height:7px; background:var(--work) }

  main { max-width:1440px; margin:0 auto; padding:28px 32px 40px }
  .titlebar { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px }
  h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.02em }
  .titlebar p { margin:4px 0 0; color:var(--muted); font-size:13px }
  .filters { display:flex; gap:8px; flex-wrap:wrap }
  .chip { height:30px; padding:0 12px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:13px; font-weight:500; cursor:pointer }
  .chip[aria-pressed="true"] { background:var(--elev); border-color:var(--border2); color:var(--text) }
  .chip span { color:var(--faint); font-weight:400; margin-left:4px }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px }
  .kpi { padding:16px 18px }
  .kpi .top { display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px }
  .kpi .mid { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:10px }
  .kpi b { font-size:28px; font-weight:600; letter-spacing:-.03em } .kpi .unit { color:var(--faint); font-size:13px; margin-left:4px }
  .kpi .note { margin-top:8px; color:var(--faint); font-size:12px }

  .layout { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start }
  .table { flex:1 1 640px; min-width:0; overflow-x:auto }
  .tin { min-width:860px }
  .row, .thead { display:grid; grid-template-columns:28px minmax(200px,1.7fr) 128px 112px 150px 120px 72px 88px; gap:12px; align-items:center; padding:0 18px }
  .thead { height:40px; border-bottom:1px solid var(--border); color:var(--faint); font-size:12px; font-weight:500 }
  .row { height:60px; border-bottom:1px solid var(--border); cursor:pointer }
  .row:last-child { border-bottom:0 } .row:hover, .row.sel { background:var(--elev) }
  .wt { min-width:0 } .wt-name { all:unset; cursor:pointer; font-weight:500; display:block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .wt-name:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px }
  .branch { margin-top:2px; font-size:12px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .pin { all:unset; cursor:pointer; display:grid; place-items:center; width:24px; height:24px; color:var(--faint) } .pin.on { color:var(--wait) } .pin:focus-visible { outline:2px solid var(--accent); border-radius:6px }
  .badge { display:inline-flex; align-items:center; gap:7px; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap; background:color-mix(in srgb,var(--c) 14%,transparent); color:var(--c) }
  .stack { display:flex; align-items:center } .av { width:24px; height:24px; display:grid; place-items:center; border-radius:50%; border:2px solid var(--surface); background:var(--elev); font-size:11px; font-weight:600; margin-left:-5px }
  .av:first-child { margin-left:0 } .av.main { background:var(--accent); color:var(--accent-ink) } .stack small { margin-left:8px; color:var(--faint); font-size:12px }
  .row:hover .av, .row.sel .av { border-color:var(--elev) }
  .skill { display:inline-block; max-width:100%; height:24px; line-height:22px; padding:0 8px; border:1px solid var(--border2); border-radius:6px; color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle }
  .meter { display:flex; align-items:center; gap:10px } .meter .bar { flex:1; height:4px; border-radius:2px; background:var(--border) } .meter .bar i { display:block; height:100%; border-radius:2px }
  .meter span { width:38px; text-align:right; font-size:13px }
  aside.side { flex:0 1 320px; min-width:280px; display:flex; flex-direction:column; gap:16px }
  .box h2 { margin:0; padding:14px 16px; font-size:13px; font-weight:600; border-bottom:1px solid var(--border) }
  .li { padding:12px 16px; border-bottom:1px solid var(--border); font-size:12.5px } .li:last-child { border-bottom:0 }
  .li .h { display:flex; justify-content:space-between; gap:8px; font-size:13px } .li p { margin:4px 0 0; color:var(--muted); overflow-wrap:anywhere }
  .cores { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; padding:14px 16px } .cores i { aspect-ratio:1; border-radius:4px; background:var(--border) }
  .empty { padding:36px 16px; text-align:center; color:var(--muted) }

  /* gaveta */
  .scrim { position:fixed; inset:0; background:var(--scrim); z-index:9 }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(680px,100vw); display:flex; flex-direction:column; background:var(--surface); border-left:1px solid var(--border2); box-shadow:-24px 0 48px rgba(0,0,0,.35); z-index:10 }
  .dh { padding:18px 24px 0 } .dh .t { display:flex; align-items:center; gap:12px; flex-wrap:wrap } .dh h2 { margin:0; font-size:18px; font-weight:600; letter-spacing:-.02em; word-break:break-all }
  .tag { display:inline-flex; align-items:center; height:22px; padding:0 8px; border:1px solid var(--border2); border-radius:6px; color:var(--muted); font-size:11.5px }
  .iconbtn { all:unset; cursor:pointer; display:grid; place-items:center; width:28px; height:28px; color:var(--muted) } .iconbtn:hover { color:var(--text) } .iconbtn:focus-visible { outline:2px solid var(--accent); border-radius:6px }
  #dpin.on { color:var(--wait) }
  .dsub { margin:6px 0 0; color:var(--faint); font-size:12.5px }
  .tabs { display:flex; gap:20px; margin-top:16px; border-bottom:1px solid var(--border); margin-left:-24px; margin-right:-24px; padding:0 24px }
  .tabs button { all:unset; cursor:pointer; padding:8px 0 10px; border-bottom:2px solid transparent; margin-bottom:-1px; color:var(--muted); font-size:13px; font-weight:500 }
  .tabs button[aria-selected="true"] { color:var(--text); border-color:var(--accent) } .tabs button:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  .dbody { flex:1; min-height:0; overflow:auto; padding:20px 24px; display:flex; flex-direction:column; gap:22px }
  .dbody h3 { margin:0 0 8px; font-size:12px; font-weight:500; color:var(--faint); display:flex; justify-content:space-between }
  .skillcard { display:flex; align-items:center; gap:14px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--elev) }
  .skillcard .ic { flex:none; display:grid; place-items:center; width:32px; height:32px; border-radius:8px; border:1px solid var(--border2); color:var(--accent) }
  .topo { position:relative; border:1px solid var(--border); border-radius:10px; background:var(--bg); overflow:hidden }
  .topo .in { position:absolute; left:12px; top:16px; width:608px }
  .node { position:absolute; box-sizing:border-box; padding:10px 12px; border:1px solid var(--border2); border-radius:10px; background:var(--surface) }
  .node.main { border-color:var(--accent); width:180px; padding:12px } .node.sub { left:316px; width:292px }
  .node .n { display:flex; align-items:center; gap:8px } .node .n .l { display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--elev); border:1px solid var(--border2); font-size:11px; font-weight:600 }
  .node.main .n .l { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); width:24px; height:24px }
  .node .n .m { margin-left:auto; font-size:11px; color:var(--faint) } .node .s { margin-top:6px; display:flex; align-items:center; gap:6px; font-size:12px; white-space:nowrap }
  .node .tool { margin-top:3px; font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .links, .pkt { position:absolute; left:0; top:0 }
  .pkt { width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent); animation:travel 2.6s linear infinite }
  .talk { border:1px solid var(--border); border-radius:10px; overflow:hidden }
  .talk > div { display:grid; grid-template-columns:62px 150px 76px minmax(0,1fr); gap:10px; align-items:baseline; padding:9px 14px; border-top:1px solid var(--border); font-size:12.5px } .talk > div:first-child { border-top:0 }
  .talk .ov { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .feed { display:flex; flex-direction:column; gap:6px }
  .it { border-left:3px solid var(--border); padding:2px 0 2px 8px; font-size:12.5px; overflow-wrap:anywhere; white-space:pre-wrap }
  .it .k { font-size:10.5px; font-weight:700; letter-spacing:.05em; margin-right:6px; color:var(--muted) } .it time { color:var(--faint); font-size:11px; margin-left:6px }
  .it.user { border-color:var(--accent) } .it.text { border-color:var(--work) } .it.tool { border-color:var(--wait) } .it.result { color:var(--muted) }
  .it.user .k { color:var(--accent) } .it.text .k { color:var(--work) } .it.tool .k { color:var(--wait) }
  .grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:12px } .grid2 .card { padding:12px 14px }
  table { width:100%; border-collapse:collapse; font-size:12px } td { padding:4px; border-top:1px solid var(--border); white-space:nowrap } td.n { text-align:right } td.c { max-width:300px; overflow:hidden; text-overflow:ellipsis }

  /* arena */
  .chips { display:flex; gap:8px; flex-wrap:wrap }
  .pill { display:inline-flex; align-items:center; gap:7px; height:28px; padding:0 12px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--muted); font-size:12.5px }
  .stations { display:grid; grid-template-columns:repeat(auto-fill,minmax(520px,1fr)); gap:20px; margin-top:20px }
  .st { padding:18px 24px; cursor:pointer } .st[data-state="hot"] { border-color:color-mix(in srgb,var(--hot) 55%,var(--border)) } .st[data-state="waiting"] { border-color:color-mix(in srgb,var(--wait) 45%,var(--border)) } .st[data-state="done"] { border-color:color-mix(in srgb,var(--work) 55%,var(--border)) }
  .st .hd { display:flex; align-items:center; gap:10px; min-height:28px } .st .hd .wt-name { font-size:15px; font-weight:600; letter-spacing:-.01em; display:inline-block; max-width:none } .st .hd .r { margin-left:auto; color:var(--faint); font-size:12px }
  .stage { position:relative; height:196px; margin-top:10px; border-radius:10px; background:var(--bg); border:1px solid var(--border); overflow:hidden }
  .stage .bub { position:absolute; left:12px; top:10px; max-width:340px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:5px 10px; border:1px solid var(--border2); border-radius:8px; background:var(--surface); color:var(--muted); font-size:12px; z-index:2 }
  .stage .lbl { position:absolute; left:50px; top:168px; width:120px; text-align:center; color:var(--faint); font-size:11.5px }
  .char { position:absolute; left:66px; top:50px; width:88px; height:106px; color:var(--c, var(--idle)) }
  .char .eye { fill:currentColor } .char .badge-done, .char .q { display:none }
  .st[data-state="working"] { --c:var(--work) } .st[data-state="hot"] { --c:var(--hot) } .st[data-state="waiting"] { --c:var(--wait) } .st[data-state="done"] { --c:var(--work) } .st[data-state="idle"] { --c:var(--idle) }
  .st[data-state="idle"] .eye { transform:scaleY(.25); transform-box:fill-box; transform-origin:center }
  .st[data-state="working"] .char { animation:bob 1.1s ease-in-out infinite } .st[data-state="hot"] .char { animation:shake .3s linear infinite } .st[data-state="done"] .char { animation:jump .8s ease-out infinite }
  .st[data-state="done"] .badge-done, .st[data-state="waiting"] .q { display:block }
  .typing { position:absolute; left:164px; top:118px; display:none; align-items:flex-end; gap:3px; height:14px } .st[data-state="working"] .typing, .st[data-state="hot"] .typing { display:flex }
  .typing i { display:block; width:3px; height:14px; border-radius:2px; background:var(--c); transform-origin:bottom; animation:eq .9s ease-in-out infinite } .typing i:nth-child(2) { animation-delay:-.3s } .typing i:nth-child(3) { animation-delay:-.6s }
  .sub { position:absolute; left:400px; display:flex; align-items:center; gap:10px; font-size:12.5px } .sub b { font-weight:500; display:block } .sub small { font-size:11.5px }
  .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:14px }
  .stats .h { display:flex; justify-content:space-between; font-size:12px; color:var(--faint) } .stats .h span:last-child { color:var(--text) } .stats .bar { margin-top:6px; height:4px; border-radius:2px; background:var(--border) } .stats .bar i { display:block; height:100%; border-radius:2px }
  @keyframes travel { from { offset-distance:0% } to { offset-distance:100% } }
  @keyframes bob { 50% { transform:translateY(-3px) } } @keyframes shake { 25% { transform:translateX(-1.5px) } 75% { transform:translateX(1.5px) } }
  @keyframes jump { 0%,100% { transform:translateY(0) } 40% { transform:translateY(-12px) } } @keyframes eq { 50% { transform:scaleY(.35) } }
  @media (prefers-reduced-motion: reduce) { .pkt, .char, .typing i { animation:none !important } .pkt { offset-distance:50% } }
  @media (max-width: 900px) { .nav { flex-wrap:wrap; height:auto; padding:12px 16px; gap:12px } main { padding:20px 16px } .search { order:5; flex-basis:100% } .stations { grid-template-columns:1fr } }
</style>
</head>
<body>
<header class="nav">
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23" rx="6" fill="var(--elev)" stroke="var(--border2)"/><path d="M6 8h7M6 12h12M6 16h9" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/></svg>
    wt-monitor
  </div>
  <span class="root mono" id="root"></span>
  <div class="search"><label>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" aria-label="Buscar" placeholder="Buscar worktree, branch, agente ou skill" autocomplete="off"><kbd>Ctrl K</kbd></label></div>
  <div class="seg" role="group" aria-label="Visual">
    <button type="button" data-mode="sober" aria-pressed="true">Visão geral</button>
    <button type="button" data-mode="fun" aria-pressed="false">Arena</button>
  </div>
  <span class="live"><span class="dot"></span><span id="live">conectando…</span></span>
</header>

<main>
  <div id="overview">
    <div class="titlebar">
      <div><h1>Worktrees</h1><p id="sub"></p></div>
      <div class="filters" id="filters" role="group" aria-label="Filtros"></div>
    </div>
    <section class="kpis" id="kpis" aria-label="Resumo"></section>
    <div class="layout">
      <section class="card table" aria-label="Worktrees"><div class="tin">
        <div class="thead"><span></span><span>Worktree</span><span>Status</span><span>Agentes</span><span>Skill</span><span>CPU</span><span>Memória</span><span>60 s</span></div>
        <div id="rows"></div>
        <div class="empty" id="empty" hidden></div>
      </div></section>
      <aside class="side">
        <section class="card box"><h2>Tarefas concluídas</h2><div id="events"></div></section>
        <section class="card box"><h2>Alertas <span class="faint" id="thr" style="font-weight:400"></span></h2><div id="alerts"></div></section>
        <section class="card box"><h2>CPU por core</h2><div class="cores" id="cores"></div></section>
      </aside>
    </div>
  </div>

  <div id="arena" hidden>
    <div class="titlebar"><div><h1>Arena</h1></div><div class="chips" id="chips"></div></div>
    <div class="stations" id="stations"></div>
    <div class="empty" id="aempty" hidden></div>
  </div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-labelledby="dtitle" hidden>
  <div class="dh">
    <div class="t"><h2 id="dtitle"></h2><span class="tag mono" id="dbranch"></span><span id="dstatus"></span><span style="flex:1"></span>
      <button type="button" class="iconbtn" id="dpin"></button>
      <button type="button" class="iconbtn" id="dclose" aria-label="Fechar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="dsub" id="dsub"></p>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<script>
/* ---------- modo demonstração (?demo): dados fictícios gerados aqui, sem servidor ---------- */
const QS = new URLSearchParams(location.search), DEMO = QS.has('demo');
const DEMO_T0 = Date.now(), DEMO_ROOT = '/home/dev/projects';
const DEMO_WT = [['acme/api', 1, 'feat/order-pagination'], ['acme/web', 1, 'feat/checkout-form'], ['acme/docs', 0, 'main'], ['tools/cli', 1, 'feat/sync-command'], ['lab/ml-experiments', 1, 'exp/lora-sweep'], ['acme/mobile', 1, 'chore/deps']];
function demoData() {
  const now = Date.now(), t = (now - DEMO_T0) / 1000, T0 = Math.floor(DEMO_T0 / 1000);
  const cycle = T0 + Math.floor(t / 30) * 30; // a cada 30 s o agente de acme/web "termina uma tarefa"
  const groups = DEMO_WT.map(([name, claude, branch], i) => {
    const idle = i === 2 || i === 5;
    const cpu = i === 4 ? 320 + 20 * Math.sin(t) : idle ? 0.5 : i === 1 ? 4 + 2 * Math.sin(t) : 40 + 120 * Math.abs(Math.sin(t / (4 + i) + i));
    const rss = (i === 4 ? 4.4e9 : 3e8 + i * 2.2e8) + 2e7 * Math.sin(t / 3 + i);
    const cmds = [claude ? 'claude' : 'node server.js', i === 4 ? 'python train.py --epochs 40' : 'node ./node_modules/.bin/vite', 'cargo build --release'];
    return {

  });

    const t = T(e);

      } else if (b.type === 'text' && b.role === 'user' && typeof b.text === 'string' && b.text.includes('<task-notification>')) {

function statusOf(g, a) {

  if (a.main === 'text') return age > 1800 ? 'idle' : 'waiting';   // terminou o turno: espera você
  if (a.main === 'tool') return age > 90 ? 'waiting' : 'working';   // ferramenta parada há muito: provável pedido de permissão

function spark(vals, w, h, color, max) {

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" aria-hidden="true"><polyline points="${pts}" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function sync(container, items, make, update) {

  const map = container._m || (container._m = new Map()), seen = new Set();

    h += `<svg class="links" width="628" height="196" viewBox="0 0 628 196" fill="none" aria-hidden="true"><path d="${path(top)}" stroke="var(--border2)" stroke-width="1.5"/></svg>`;
    if (recent) h += `<span class="pkt" style="offset-path:path('${path(top)}');animation-direction:${recent.from === 'principal' ? 'normal' : 'reverse'}"></span>`;
    h += `<div class="sub" style="top:${top}px;opacity:${s.running ? 1 : .7}"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" aria-hidden="true"><line x1="24" y1="2" x2="24" y2="8" stroke="var(--border2)" stroke-width="2" stroke-linecap="round"/><circle cx="24" cy="2.5" r="2.5" fill="${c}"/><rect x="4" y="8" width="40" height="34" rx="10" fill="var(--elev)" stroke="var(--border2)"/><rect x="9" y="14" width="30" height="20" rx="6" fill="#050507"/><rect x="15" y="21" width="6" height="6" rx="1.5" fill="${c}"/><rect x="27" y="21" width="6" height="6" rx="1.5" fill="${c}"/></svg><div><b>${esc(s.type)}</b><small style="color:${c}">${s.running ? 'Executando' : 'Concluído'}</small></div></div>`;
  });
  return h;
}
function updateStation(el, r) {
  const { g } = r, done = lastDone[g.path] && nowSec() - lastDone[g.path].t < 12, state = done ? 'done' : r.st;
  const n = xp[g.path] || 0, { L, p } = levelOf(n), ev = lastDone[g.path];
  el.dataset.state = state;
  setPin(el.querySelector('.pin'), r.pinned, g.name);
  setHTML(el.querySelector('.stb'), badge(r.st));
  el.querySelector('.r').textContent = `Nv ${L} · ${n} tarefa${n === 1 ? '' : 's'}`;
  const talk = r.a && r.a.talk[r.a.talk.length - 1], fresh = talk && nowSec() - talk.t < 60;
  el.querySelector('.bub').textContent =
    state === 'done' ? '✔ ' + (ev.msg.slice(0, 80) || 'Tarefa concluída!') :
    state === 'hot' ? 'No limite — veja CPU e memória.' :
    state === 'waiting' ? 'Aguardando a sua resposta.' :
    state === 'working' ? (fresh ? `${talk.from} → ${talk.to}: ${talk.msg}`.slice(0, 70) : `rodando ${baseName(g.procs[0]?.cmd || '') || 'algo'}…`) :
    g.idle ? 'sem processos' : 'zzz… aguardando';
  setHTML(el.querySelector('.layer'), stageLayer(r));
  const bar = (label, v, w, c) => `<div><div class="h"><span>${label}</span><span>${v}</span></div><div class="bar"><i style="width:${Math.min(100, w)}%;background:${c}"></i></div></div>`;
  setHTML(el.querySelector('.stats'),
    bar('CPU', g.cpu.toFixed(0) + '%', 100 * g.cpu / data.cfg.cpu_pct, state === 'hot' ? 'var(--hot)' : 'var(--work)') +
    bar('Memória', fmtB(g.rss), 100 * g.rss / data.cfg.mem_bytes, state === 'hot' ? 'var(--hot)' : 'var(--muted)') +
    bar(`XP até o Nv ${L + 1}`, (p * 100).toFixed(0) + '%', p * 100, 'var(--wait)'));
}

/* ---------- gaveta ---------- */
const TABS = [['overview', 'Visão geral'], ['agents', 'Agentes'], ['activity', 'Atividade'], ['procs', 'Processos']];
function openDrawer(path, opener) {
  drawerPath = path; drawerOpener = opener;
  $('drawer').hidden = false; $('scrim').hidden = false; $('dclose').focus();
  renderDrawer(); pollActivity();
}
function closeDrawer() {
  drawerPath = null; $('drawer').hidden = true; $('scrim').hidden = true;
  if (drawerOpener && document.contains(drawerOpener)) drawerOpener.focus();
  if (data) render(data);
}
function topology(r) {
  const a = r.a, now = nowSec();
  const subs = a.subs.filter(s => s.running || now - s.mtime < 600).slice(0, 6), n = subs.length, sp = n <= 3 ? 100 : 84;
  const H = n ? (n - 1) * sp + 84 : 96, mainTop = n ? H / 2 - 48 : 0, mc = mainTop + 48;
  const path = i => `M180 ${mc} C 248 ${mc}, 248 ${i * sp + 42}, 316 ${i * sp + 42}`;
  let h = `<div class="topo" style="height:${H + 32}px"><div class="in" style="height:${H}px">`;
  subs.forEach((s, i) => { h += `<svg class="links" width="608" height="${H}" viewBox="0 0 608 ${H}" fill="none" aria-hidden="true"><path d="${path(i)}" stroke="${s.running ? 'var(--border2)' : 'var(--border)'}" stroke-width="1.5"${s.running ? '' : ' stroke-dasharray="4 4"'}/></svg>`; });
  subs.forEach((s, i) => {
    const recent = a.talk.filter(t => (t.from === s.type || t.to === s.type) && now - t.t < 40).pop();
    if (recent) h += `<span class="pkt" style="offset-path:path('${path(i)}');animation-direction:${recent.from === 'principal' ? 'normal' : 'reverse'}"></span>`;
  });
  h += `<div class="node main" style="top:${mainTop}px"><div class="n"><span class="l">M</span><b>Principal</b><span class="m mono">${esc(r.g.claude ? 'claude' : '')}</span></div>
    <div class="s" style="color:${STATUS[r.st][1]}"><span class="dot"></span>${r.st === 'working' ? (n ? 'Orquestrando' : 'Trabalhando') : STATUS[r.st][0]}</div>
    <div class="tool mono">${n ? `${subs.filter(s => s.running).length} subagente(s) ativos` : 'sem subagentes'}</div></div>`;
  subs.forEach((s, i) => {
    const c = s.running ? 'var(--work)' : 'var(--idle)';
    h += `<div class="node sub" style="top:${i * sp}px;opacity:${s.running ? 1 : .75}"><div class="n"><span class="l">${esc((s.type[0] || '?').toUpperCase())}</span><b>${esc(s.type)}</b><span class="m mono">${esc(s.model)}</span></div>
      <div class="s" style="color:${c}"><span class="dot"></span>${s.running ? 'Executando' : 'Concluído'}<span class="faint">· ${ago(s.mtime)}</span></div><div class="tool mono">${esc(s.tool || s.desc)}</div></div>`;
  });
  return h + '</div></div>';
}
function agentsTab(r) {
  const a = r.a;
  if (!r.g.claude && !(a && a.found)) return '<div class="empty">Nenhuma sessão do Claude encontrada neste worktree.</div>';
  if (!a || !a.found) return '<div class="empty">Carregando a sessão…</div>';
  const sk = activeSkill(a) || a.skill, running = a.subs.filter(s => s.running).length;
  let h = `<section><h3>Skill ${activeSkill(a) ? 'ativa' : 'mais recente'}</h3>` + (sk
    ? `<div class="skillcard"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></span>
       <div style="flex:1;min-width:0"><div class="mono" style="font-size:13px;font-weight:500">${esc(sk.name)}</div></div><span class="faint" style="font-size:12px">${ago(sk.t)}</span></div>`
    : '<div class="muted" style="font-size:13px">Nenhuma skill invocada nesta sessão.</div>') + '</section>';
  h += `<section><h3><span>Agentes · ${1 + running} em execução</span><span>${a.talk.filter(t => nowSec() - t.t < 40).length ? 'conversando agora' : ''}</span></h3>${topology(r)}</section>`;
  h += `<section><h3>Conversa entre agentes</h3>` + (a.talk.length
    ? `<div class="talk">${a.talk.slice(-8).map(m => `<div><span class="faint mono">${clock(m.t)}</span><span class="muted mono">${esc(m.from)} <span class="faint">→</span> ${esc(m.to)}</span><b style="font-weight:500;color:${m.kind === 'Concluiu' ? 'var(--work)' : m.kind === 'Falhou' ? 'var(--hot)' : m.kind === 'Mensagem' ? 'var(--wait)' : 'var(--muted)'}">${m.kind}</b><span class="ov" title="${esc(m.msg)}">${esc(m.msg)}</span></div>`).join('')}</div>`
    : '<div class="muted" style="font-size:13px">Sem mensagens entre agentes nesta sessão.</div>') + '</section>';
  return h;
}
const LABEL = { user: 'VOCÊ', text: 'AGENTE', tool: 'FERRAMENTA', result: 'RESULTADO' };
function feedItems(lines) {
  const out = [];
  for (const l of lines) {
    let e; try { e = JSON.parse(l); } catch { continue; }
    for (const b of blocks(e)) {
      const who = b.role === 'user' ? 'user' : 'text', ts = e.timestamp ? new Date(e.timestamp).toLocaleTimeString('pt-BR') : '';
      if (b.type === 'text' && b.text?.trim()) out.push({ k: who, s: brief(b.text.trim(), 600), ts });
      else if (b.type === 'tool_use') out.push({ k: 'tool', s: `${b.name}  ${summarize(b.input)}`, ts });
      else if (b.type === 'tool_result') out.push({ k: 'result', s: brief((typeof b.content === 'string' ? b.content : Array.isArray(b.content) ? b.content.map(x => x.text || '').join(' ') : '').trim(), 200), ts });
    }
  }
  return out.slice(-40);
}
function activityTab(r) {
  if (!r.a || !r.a.found) return '<div class="empty">Nenhuma transcrição do Claude encontrada para este worktree.</div>';
  return `<div class="feed">${feedItems(r.a.lines).map(i => `<div class="it ${i.k}"><span class="k">${LABEL[i.k]}</span>${esc(i.s)}${i.ts ? `<time>${i.ts}</time>` : ''}</div>`).join('') || 'Sessão sem atividade recente.'}</div>`;
}
function overviewTab(r) {
  const g = r.g, c = r.st === 'hot' ? 'var(--hot)' : 'var(--work)';
  const card = (l, v, extra = '') => `<div class="card"><div class="faint" style="font-size:12.5px">${l}</div><div style="font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:4px">${v}</div>${extra}</div>`;
  return `<div class="grid2">${card('CPU', g.cpu.toFixed(0) + '%', spark(hist[g.path] || [], 240, 32, c, Math.max(100, ...(hist[g.path] || [0]))))}${card('Memória', fmtB(g.rss), spark(memHist[g.path] || [], 240, 32, 'var(--muted)', Math.max(1e8, ...(memHist[g.path] || [0]))))}${card('Processos', g.nproc)}${card('Threads', g.threads)}</div>
    <div class="muted" style="font-size:13px">Afinidade: <span class="mono">${esc(g.aff.join(' | ') || '—')}</span> · cores ativos: <span class="mono">${g.cores_in_use.join(', ') || '—'}</span></div>`;
}
function procsTab(r) {
  const g = r.g;
  return g.procs.length ? `<table>${g.procs.map(p => `<tr><td class="n mono">${p.pid}</td><td class="c mono" title="${esc(p.cmd)}">${esc(p.cmd)}</td><td class="n">${p.pct.toFixed(0)}%</td><td class="n">${fmtB(p.rss)}</td><td class="n mono">c${p.cpu}</td></tr>`).join('')}</table>` : '<div class="empty">Nenhum processo ativo neste worktree.</div>';
}
function renderDrawer() {
  if (!drawerPath || !data) return;
  const r = rowsFor(data).find(x => x.g.path === drawerPath); if (!r) return;
  const g = r.g;
  $('dtitle').textContent = g.name; $('dbranch').textContent = g.branch; $('dbranch').hidden = !g.branch;
  setHTML($('dstatus'), badge(r.st)); setPin($('dpin'), r.pinned, g.name);
  setHTML($('dsub'), `<span class="mono">${esc(g.path.replace(/^\/home\/[^/]+/, '~'))}</span>${r.a && r.a.session ? ` · sessão ${esc(String(r.a.session).slice(0, 8))}` : ''}`);
  setHTML($('tabs'), TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join(''));
  const body = { overview: overviewTab, agents: agentsTab, activity: activityTab, procs: procsTab }[tab](r);
  const box = $('dbody'), first = box._tab !== tab, atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box._tab = tab;
  if (box._h !== body) { setHTML(box, body); if (tab === 'activity' && (atEnd || first)) box.scrollTop = box.scrollHeight; }
}

/* ---------- render principal ---------- */
let lastDone = {};
function render(d) {
  data = d;
  const n = d.cores.length, fun = mode === 'fun';
  $('root').textContent = d.root.replace(/^\/home\/[^/]+/, '~');
  $('live').textContent = 'Ao vivo · 1 s';
  lastDone = {}; d.events.forEach(e => { if (!(e.path in lastDone)) lastDone[e.path] = e; });
  countEvents(d);
  d.groups.forEach(g => {
    hist[g.path] = (hist[g.path] || []).concat(g.cpu).slice(-HIST);
    memHist[g.path] = (memHist[g.path] || []).concat(g.rss).slice(-HIST);
  });
  const all = rowsFor(d), shown = all.filter(passes);
  const total = all.reduce((s, r) => s + r.agents.length, 0), mains = all.filter(r => r.g.claude).length;
  const cpuAvg = d.cores.reduce((a, b) => a + b, 0) / n, usedMem = d.mem.total - d.mem.avail, usedPct = 100 * usedMem / d.mem.total;
  const startDay = new Date(); startDay.setHours(0, 0, 0, 0);
  const today = d.events.filter(e => e.t >= startDay / 1000).length;
  [['agents', total], ['cpu', cpuAvg], ['mem', usedMem / 1e9], ['tasks', today]].forEach(([k, v]) => { kHist[k] = kHist[k].concat(v).slice(-40); });

  if (!fun) {
    const waiting = all.filter(r => r.st === 'waiting').length;
    $('sub').textContent = `${all.filter(r => r.g.nproc).length} com atividade · ${total} agentes ativos · ${waiting} aguardando você`;
    const cnt = k => all.filter(r => k === 'all' ? true : k === 'pinned' ? r.pinned : k === 'working' ? ['working', 'hot'].includes(r.st) : r.st === k).length;
    setHTML($('filters'), [['all', 'Todos'], ['working', 'Trabalhando'], ['waiting', 'Aguardando'], ['idle', 'Ociosos'], ['pinned', 'Fixados']].map(([k, l]) => `<button type="button" class="chip" data-filter="${k}" aria-pressed="${filter === k}">${l}<span>${cnt(k)}</span></button>`).join(''));
    const top = [...d.groups].sort((a, b) => b.cpu - a.cpu)[0];
    const kpi = (label, val, unit, note, vals, color, delta = '') => `<div class="card kpi"><div class="top"><span>${label}</span><span class="faint">${delta}</span></div><div class="mid"><div><b>${val}</b><span class="unit">${unit}</span></div>${spark(vals, 96, 30, color)}</div><div class="note">${note}</div></div>`;
    setHTML($('kpis'),
      kpi('Agentes ativos', total, '', `${mains} principais · ${total - mains} subagentes`, kHist.agents, 'var(--work)') +
      kpi('CPU', cpuAvg.toFixed(0), `% de ${n} cores`, top ? `maior uso: ${esc(top.name)}` : '—', kHist.cpu, 'var(--muted)') +
      kpi('Memória', (usedMem / 1e9).toFixed(1), `de ${(d.mem.total / 1e9).toFixed(0)} GB`, `${fmtB(d.mem.avail)} livres`, kHist.mem, 'var(--muted)', usedPct.toFixed(0) + '%') +
      kpi('Tarefas hoje', today, '', d.events[0] ? `última ${ago(d.events[0].t)}` : 'nenhuma ainda', kHist.tasks, 'var(--work)'));
    setHTML($('events'), d.events.length ? d.events.slice(0, 5).map(e => `<div class="li"><div class="h"><b style="font-weight:500">${esc(e.name)}</b><span class="faint">${ago(e.t)}</span></div><p>${esc(e.msg.slice(0, 160) || 'Tarefa concluída')}</p></div>`).join('') : '<div class="li faint">aguardando a conclusão de uma tarefa…</div>');
    $('thr').textContent = `· CPU ≥ ${d.cfg.cpu_pct}% · mem ≥ ${(d.cfg.mem_bytes / 1e9).toFixed(1)} GB`;
    setHTML($('alerts'), d.alerts.length ? d.alerts.map(a => `<div class="li" style="display:flex;gap:10px"><span class="dot" style="background:var(--hot);margin-top:7px"></span><div><div style="font-weight:500">${esc(a.msg)}</div><div class="faint">${clock(a.t)}</div></div></div>`).join('') : '<div class="li faint">nenhum alerta disparado</div>');
    setHTML($('cores'), d.cores.map((u, i) => `<i title="core ${i}: ${u.toFixed(0)}%" style="background:color-mix(in srgb,${u > 85 ? 'var(--hot)' : u > 60 ? 'var(--wait)' : 'var(--work)'} ${Math.max(12, Math.round(u))}%,var(--border))"></i>`).join(''));
    sync($('rows'), shown, makeRow, updateRow);
    $('empty').hidden = shown.length > 0;
    $('empty').textContent = filter === 'pinned' ? 'Nenhum worktree fixado. Clique na ☆ de uma linha para fixar.' : query ? 'Nada encontrado para essa busca.' : 'Nenhum processo encontrado em worktrees sob a raiz.';
  } else {
    const st = shown.map(r => lastDone[r.g.path] && nowSec() - lastDone[r.g.path].t < 12 ? 'done' : r.st), c = s => st.filter(x => x === s).length;
    setHTML($('chips'), [['var(--work)', `${c('working')} trabalhando`], ['var(--wait)', `${c('waiting')} aguardando você`], ['var(--hot)', `${c('hot')} no limite`], ['var(--muted)', `${today} tarefas hoje`]].map(([col, l]) => `<span class="pill"><span class="dot" style="background:${col}"></span>${l}</span>`).join(''));
    sync($('stations'), shown, makeStation, updateStation);
    $('aempty').hidden = shown.length > 0; $('aempty').textContent = 'Nenhum worktree para mostrar.';
  }
  renderDrawer();
}

/* ---------- eventos ---------- */
function setMode(m) {
  mode = m; store('wt-mode', m);
  $('overview').hidden = m === 'fun'; $('arena').hidden = m !== 'fun';
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  if (data) render(data);
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('filters').addEventListener('click', e => { const b = e.target.closest('[data-filter]'); if (b) { filter = b.dataset.filter; store('wt-filter', filter); render(data); } });
$('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); if (data) render(data); });
function togglePin(path) { pins.has(path) ? pins.delete(path) : pins.add(path); store('wt-pins', JSON.stringify([...pins])); render(data); }
for (const id of ['rows', 'stations']) $(id).addEventListener('click', e => {
  const el = e.target.closest('[data-path]'); if (!el) return;
  if (e.target.closest('.pin')) return togglePin(el.dataset.path);
  openDrawer(el.dataset.path, el.querySelector('.wt-name'));
});
$('dpin').addEventListener('click', () => togglePin(drawerPath));
$('dclose').addEventListener('click', closeDrawer); $('scrim').addEventListener('click', closeDrawer);
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; renderDrawer(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drawerPath) closeDrawer();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); }
});

async function tick() {
  try {
    const d = DEMO ? demoData() : await (await fetch('/api')).json();
    if (!d.groups) return;
    render(d);
    const o = QS.get('open'); // ?open=acme/api abre a gaveta (útil nas capturas de tela)
    if (o && !tick.opened) { tick.opened = true; const g = d.groups.find(x => x.name === o); if (g) openDrawer(g.path, null); }
  } catch { $('live').textContent = 'sem conexão'; }
}
setMode(mode);
tick(); setInterval(tick, 1000); setInterval(pollActivity, 1000);
</script>
</body>
</html>
